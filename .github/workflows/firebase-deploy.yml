name: Deploy to Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/exciting-dubinsky

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: trade-log-b814b.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: trade-log-b814b
          VITE_FIREBASE_STORAGE_BUCKET: trade-log-b814b.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "597239798845"
          VITE_FIREBASE_APP_ID: "1:597239798845:web:cd4160cb5666a8602a1e54"
          VITE_FIREBASE_MEASUREMENT_ID: G-8S28Y75G4X
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_FUNCTIONS_BASE_URL: https://us-central1-trade-log-b814b.cloudfunctions.net
          VITE_STRIPE_PRICE_ID: ${{ secrets.VITE_STRIPE_PRICE_ID }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting + storage rules
        run: npx firebase-tools deploy --only hosting,storage --project trade-log-b814b --non-interactive
